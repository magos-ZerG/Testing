name: lab_02_android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover individual tests
    runs-on: ubuntu-24.04
    outputs:
      unit_python: ${{ steps.tests.outputs.unit_python }}
      unit_android: ${{ steps.tests.outputs.unit_android }}
      integration: ${{ steps.tests.outputs.integration }}
      e2e: ${{ steps.tests.outputs.e2e }}
      device: ${{ steps.tests.outputs.device }}
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate each test as its own job
        id: tests
        run: python3 lab2/scripts/ci_catalog.py --github-output "$GITHUB_OUTPUT" --summary

  unit-python:
    name: "Unit / Python · ${{ matrix.title }}"
    needs: [discover]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.unit_python) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run the single test in Docker
        id: test
        env:
          TEST_KIND: python-unit
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
        run: bash lab2/scripts/ci_run_one.sh "$TEST_KIND" "$CASE_ID" "$TEST_SELECTOR"

      - name: Record outcome and create fallback test report
        if: ${{ always() }}
        env:
          TEST_KIND: python-unit
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          python3 lab2/scripts/ci_case_reports.py record \
            --kind "$TEST_KIND" --id "$CASE_ID" --selector "$TEST_SELECTOR" --outcome "$TEST_OUTCOME"

      - name: Upload this test's results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-case-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: lab2/reports/
          if-no-files-found: error
          retention-days: 30

  unit-android:
    name: "Unit / Kotlin · ${{ matrix.title }}"
    needs: [discover]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.unit_android) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run the single test in Docker
        id: test
        env:
          TEST_KIND: android-unit
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
        run: bash lab2/scripts/ci_run_one.sh "$TEST_KIND" "$CASE_ID" "$TEST_SELECTOR"

      - name: Record outcome and create fallback test report
        if: ${{ always() }}
        env:
          TEST_KIND: android-unit
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          python3 lab2/scripts/ci_case_reports.py record \
            --kind "$TEST_KIND" --id "$CASE_ID" --selector "$TEST_SELECTOR" --outcome "$TEST_OUTCOME"

      - name: Upload this test's results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-case-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: lab2/reports/
          if-no-files-found: error
          retention-days: 30

  integration:
    name: "Integration / PostgreSQL (twice) · ${{ matrix.title }}"
    needs: [discover, unit-python, unit-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.integration) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run the single test in Docker
        id: test
        env:
          TEST_KIND: integration
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
        run: bash lab2/scripts/ci_run_one.sh "$TEST_KIND" "$CASE_ID" "$TEST_SELECTOR"

      - name: Record outcome and create fallback test report
        if: ${{ always() }}
        env:
          TEST_KIND: integration
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          python3 lab2/scripts/ci_case_reports.py record \
            --kind "$TEST_KIND" --id "$CASE_ID" --selector "$TEST_SELECTOR" --outcome "$TEST_OUTCOME"

      - name: Upload this test's results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-case-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: lab2/reports/
          if-no-files-found: error
          retention-days: 30

  android-device:
    name: "Android / physical device · ${{ matrix.title }}"
    needs: [discover, integration]
    runs-on: [self-hosted, linux, x64, android-device]
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.device) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker and connected Android device
        run: |
          docker info >/dev/null
          adb start-server
          adb devices -l
          adb devices | grep -Eq '[[:space:]]device$'
      - name: Run the single test in Docker
        id: test
        env:
          TEST_KIND: device
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
        run: bash lab2/scripts/ci_run_one.sh "$TEST_KIND" "$CASE_ID" "$TEST_SELECTOR"

      - name: Record outcome and create fallback test report
        if: ${{ always() }}
        env:
          TEST_KIND: device
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          python3 lab2/scripts/ci_case_reports.py record \
            --kind "$TEST_KIND" --id "$CASE_ID" --selector "$TEST_SELECTOR" --outcome "$TEST_OUTCOME"

      - name: Upload this test's results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-case-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: lab2/reports/
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: "E2E / HTTP · ${{ matrix.title }}"
    needs: [discover, android-device]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.e2e) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run the single test in Docker
        id: test
        env:
          TEST_KIND: e2e
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
        run: bash lab2/scripts/ci_run_one.sh "$TEST_KIND" "$CASE_ID" "$TEST_SELECTOR"

      - name: Record outcome and create fallback test report
        if: ${{ always() }}
        env:
          TEST_KIND: e2e
          CASE_ID: ${{ matrix.id }}
          TEST_SELECTOR: ${{ matrix.selector }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          python3 lab2/scripts/ci_case_reports.py record \
            --kind "$TEST_KIND" --id "$CASE_ID" --selector "$TEST_SELECTOR" --outcome "$TEST_OUTCOME"

      - name: Upload this test's results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-case-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: lab2/reports/
          if-no-files-found: error
          retention-days: 30

  prepare-pages:
    name: Collect results + Allure history + Pages artifact
    needs: [discover, unit-python, unit-android, integration, android-device, e2e]
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: studymate-lab2-pages-history
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Check which test-result artifacts actually exist
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prefix="lab2-case-${{ github.run_id }}-${{ github.run_attempt }}-"
          if ! count="$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq ".artifacts | map(select(.name | startswith(\"$prefix\"))) | length")"; then
            echo 'Warning: artifact API call failed; preparing failure diagnostics' >&2
            count=0
          fi
          echo "Found $count individual test artifacts"
          if [[ "$count" -gt 0 ]]; then echo 'found=true' >> "$GITHUB_OUTPUT"; else echo 'found=false' >> "$GITHUB_OUTPUT"; fi

      - name: Download available test results (never request a nonexistent exact name)
        if: ${{ steps.artifacts.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: lab2-case-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: lab2/reports/

      - name: Include skipped tests and infrastructure failures in Allure
        env:
          CI_STATUS_UNIT_PYTHON: ${{ needs.unit-python.result }}
          CI_STATUS_UNIT_ANDROID: ${{ needs.unit-android.result }}
          CI_STATUS_INTEGRATION: ${{ needs.integration.result }}
          CI_STATUS_E2E: ${{ needs.e2e.result }}
          CI_STATUS_DEVICE: ${{ needs.android-device.result }}
        run: python3 lab2/scripts/ci_case_reports.py aggregate --device

      - name: Restore previously published report from gh-pages
        shell: bash
        run: |
          mkdir -p .pages-site
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch --no-tags origin gh-pages
            git archive FETCH_HEAD | tar -xf - -C .pages-site
          else
            echo 'First Pages publication: no gh-pages branch yet'
          fi

      - name: Merge historical trends into current results
        env:
          LAB2_TEST_CONCLUSION: ${{ needs.e2e.result == 'success' && 'success' || 'failure' }}
          LAB2_PAGES_BASE_URL: ${{ vars.LAB2_PAGES_BASE_URL }}
        run: python3 lab2/scripts/pages_site.py prepare --site .pages-site --reports lab2/reports

      - name: Build Allure 2 HTML in its Docker container
        run: bash lab2/scripts/run-lab2.sh report

      - name: Save current report and the previous runs
        env:
          LAB2_PAGES_BASE_URL: ${{ vars.LAB2_PAGES_BASE_URL }}
        run: python3 lab2/scripts/pages_site.py finish --site .pages-site --reports lab2/reports

      - name: Persist Pages history in gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .pages-site
          force_orphan: true

      - name: Upload GitHub Pages website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Upload merged raw results for debugging
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-collected-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab2/reports/
          if-no-files-found: warn
          retention-days: 30

  deploy-pages:
    name: Deploy Allure to GitHub Pages
    needs: [prepare-pages]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show report URL
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### [StudyMate Allure report]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Previous runs](${{ steps.deployment.outputs.page_url }}runs/)" >> "$GITHUB_STEP_SUMMARY"
