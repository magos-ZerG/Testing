name: lab_02_android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-python:
    name: "Python unit (8 tests)"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run all unit-python tests in one Docker stage
        id: tests
        env:
          LAB2_CI_STAGE: '1'
        run: bash lab2/scripts/run-lab2.sh unit-python

      - name: Record stage status for Allure aggregation
        if: ${{ always() }}
        env:
          STAGE_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p lab2/reports/ci-stage-results
          printf '%s\n' "$STAGE_OUTCOME" > lab2/reports/ci-stage-results/unit-python.txt

      - name: Upload unit-python test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-stage-${{ github.run_id }}-${{ github.run_attempt }}-unit-python
          path: lab2/reports/
          if-no-files-found: warn
          retention-days: 30
  unit-android:
    name: "Kotlin unit / Robolectric (10 tests)"
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker is ephemeral on a GitHub-hosted runner; an external Docker volume
      # alone cannot persist across CI runs. Cache a host directory and bind it
      # directly to the container's GRADLE_USER_HOME.
      - name: Restore Gradle distributions and dependencies
        uses: actions/cache@v4
        with:
          path: .ci-cache/gradle
          key: gradle-linux-v2-${{ hashFiles('mobile-app/gradle/wrapper/gradle-wrapper.properties', 'mobile-app/**/*.gradle.kts', 'mobile-app/gradle/libs.versions.toml', 'mobile-app/gradle.properties') }}
          restore-keys: |
            gradle-linux-v2-

      - name: Prepare writable Gradle cache directory
        run: mkdir -p .ci-cache/gradle

      - name: Run all unit-android tests in one Docker stage
        id: tests
        env:
          LAB2_CI_STAGE: '1'
          LAB2_GRADLE_CACHE_MOUNT: ${{ github.workspace }}/.ci-cache/gradle
        run: bash lab2/scripts/run-lab2.sh unit-android

      - name: Restore runner permissions for cache upload
        if: ${{ always() }}
        run: |
          if [[ -d .ci-cache/gradle ]]; then
            sudo chown -R "$(id -u):$(id -g)" .ci-cache/gradle
          fi

      - name: Record stage status for Allure aggregation
        if: ${{ always() }}
        env:
          STAGE_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p lab2/reports/ci-stage-results
          printf '%s\n' "$STAGE_OUTCOME" > lab2/reports/ci-stage-results/unit-android.txt

      - name: Upload unit-android test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-stage-${{ github.run_id }}-${{ github.run_attempt }}-unit-android
          path: lab2/reports/
          if-no-files-found: warn
          retention-days: 30
  integration:
    name: "Integration / PostgreSQL (9 tests, 2 passes)"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [unit-python, unit-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run all integration tests in one Docker stage
        id: tests
        env:
          LAB2_CI_STAGE: '1'
        run: bash lab2/scripts/run-lab2.sh integration

      - name: Record stage status for Allure aggregation
        if: ${{ always() }}
        env:
          STAGE_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p lab2/reports/ci-stage-results
          printf '%s\n' "$STAGE_OUTCOME" > lab2/reports/ci-stage-results/integration.txt

      - name: Upload integration test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-stage-${{ github.run_id }}-${{ github.run_attempt }}-integration
          path: lab2/reports/
          if-no-files-found: warn
          retention-days: 30
  android-device:
    name: "Android instrumentation / physical device (4 tests)"
    runs-on: [self-hosted, linux, x64, android-device]
    timeout-minutes: 85
    needs: [integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker and USB-connected phone
        run: |
          docker info >/dev/null
          docker compose version
          adb start-server
          adb devices -l
          adb devices | grep -Eq '[[:space:]]device$'

      - name: Run all android-device tests in one Docker stage
        id: tests
        env:
          LAB2_CI_STAGE: '1'
        run: bash lab2/scripts/run-lab2.sh android-device

      - name: Record stage status for Allure aggregation
        if: ${{ always() }}
        env:
          STAGE_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p lab2/reports/ci-stage-results
          printf '%s\n' "$STAGE_OUTCOME" > lab2/reports/ci-stage-results/android-device.txt

      - name: Upload android-device test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-stage-${{ github.run_id }}-${{ github.run_attempt }}-android-device
          path: lab2/reports/
          if-no-files-found: warn
          retention-days: 30
  e2e:
    # A GitHub-hosted job; this E2E never installs an APK on the real phone.
    # Independent of the self-hosted android-device job: a USB phone isn't
    # required for app E2E. The Pages job collects both sets of results.
    name: "Headless Android app E2E / GitHub emulator + API + PostgreSQL"
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    needs: [integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Gradle distributions and dependencies
        uses: actions/cache@v4
        with:
          path: .ci-cache/gradle
          key: gradle-linux-v2-${{ hashFiles('mobile-app/gradle/wrapper/gradle-wrapper.properties', 'mobile-app/**/*.gradle.kts', 'mobile-app/gradle/libs.versions.toml', 'mobile-app/gradle.properties') }}
          restore-keys: |
            gradle-linux-v2-

      - name: Prepare writable Gradle cache
        run: mkdir -p .ci-cache/gradle

      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Run real StudyMate application E2E on GitHub emulator (no UI)
        id: tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LAB2_CI_STAGE: '1'
          LAB2_GRADLE_CACHE_MOUNT: ${{ github.workspace }}/.ci-cache/gradle
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash lab2/scripts/run-lab2.sh e2e

      - name: Restore runner permissions for Gradle cache upload
        if: ${{ always() }}
        run: |
          if [[ -d .ci-cache/gradle ]]; then
            sudo chown -R "$(id -u):$(id -g)" .ci-cache/gradle
          fi

      - name: Record E2E stage status for Allure aggregation
        if: ${{ always() }}
        env:
          STAGE_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p lab2/reports/ci-stage-results
          printf '%s\n' "$STAGE_OUTCOME" > lab2/reports/ci-stage-results/e2e.txt

      - name: Upload Android E2E JUnit and Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-stage-${{ github.run_id }}-${{ github.run_attempt }}-e2e
          path: lab2/reports/
          if-no-files-found: warn
          retention-days: 30
  prepare-pages:
    name: Collect stage results + generate Allure + save Pages history
    needs: [unit-python, unit-android, integration, android-device, e2e]
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: studymate-lab2-pages-history
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for available stage artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prefix="lab2-stage-${{ github.run_id }}-${{ github.run_attempt }}-"
          if ! count="$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq ".artifacts | map(select(.name | startswith(\"$prefix\"))) | length")"; then
            echo 'Warning: could not enumerate artifacts; Allure will report the missing data' >&2
            count=0
          fi
          echo "Found $count stage artifacts"
          if [[ "$count" -gt 0 ]]; then echo 'found=true' >> "$GITHUB_OUTPUT"; else echo 'found=false' >> "$GITHUB_OUTPUT"; fi

      - name: Download the available test results
        if: ${{ steps.artifacts.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: lab2-stage-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: lab2/reports/

      - name: Include failed and skipped stages in Allure
        env:
          CI_STATUS_UNIT_PYTHON: ${{ needs.unit-python.result }}
          CI_STATUS_UNIT_ANDROID: ${{ needs.unit-android.result }}
          CI_STATUS_INTEGRATION: ${{ needs.integration.result }}
          CI_STATUS_E2E: ${{ needs.e2e.result }}
          CI_STATUS_ANDROID_DEVICE: ${{ needs.android-device.result }}
        run: python3 lab2/scripts/ci_stage_reports.py

      - name: Restore previous Allure report from gh-pages
        shell: bash
        run: |
          mkdir -p .pages-site
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch --no-tags origin gh-pages
            git archive FETCH_HEAD | tar -xf - -C .pages-site
          else
            echo 'First publication: gh-pages does not exist yet'
          fi

      - name: Restore historical trends into current results
        env:
          LAB2_TEST_CONCLUSION: ${{ needs.e2e.result == 'success' && 'success' || 'failure' }}
          LAB2_PAGES_BASE_URL: ${{ vars.LAB2_PAGES_BASE_URL }}
        run: python3 lab2/scripts/pages_site.py prepare --site .pages-site --reports lab2/reports

      - name: Generate combined Allure report
        run: bash lab2/scripts/run-lab2.sh report

      - name: Update Pages website and archive this run
        env:
          LAB2_PAGES_BASE_URL: ${{ vars.LAB2_PAGES_BASE_URL }}
        run: python3 lab2/scripts/pages_site.py finish --site .pages-site --reports lab2/reports

      - name: Persist historical website in gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .pages-site
          force_orphan: true

      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Upload combined diagnostic results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab2-collected-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab2/reports/
          if-no-files-found: warn
          retention-days: 30

  deploy-pages:
    name: Publish Allure website (GitHub Pages)
    needs: [prepare-pages]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show report URL
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### [Latest StudyMate Allure report]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Archived reports](${URL}runs/)" >> "$GITHUB_STEP_SUMMARY"
