services:
  postgres:
    image: postgres:17
    container_name: studymate-postgres
    environment:
      POSTGRES_DB: studymate
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate -d studymate"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    container_name: studymate-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: studymate
      MONGO_INITDB_ROOT_PASSWORD: studymate
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "studymate", "-p", "studymate", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: studymate-api
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_BACKEND: ${DATABASE_BACKEND:-postgresql}
      DATABASE_URL: ${DATABASE_URL}
      MONGO_URL: ${MONGO_URL:-mongodb://studymate:studymate@mongo:27017/studymate?authSource=admin}
      MONGO_DATABASE: ${MONGO_DATABASE:-studymate}
      HOST: 0.0.0.0
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      FILE_STORAGE_DIR: ${FILE_STORAGE_DIR:-/app/storage/files}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/app/storage/logs/studymate-server.log}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    volumes:
      - app_storage:/app/storage

volumes:
  postgres_data:
  mongo_data:
  app_storage:
