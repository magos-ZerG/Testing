# Build is a distinct CI stage. Each test job uses a fresh, isolated
# PostgreSQL/FastAPI Compose project and uploads its own JUnit/Allure artifacts.
stages:
  - build
  - unit
  - integration
  - e2e

.lab2-docker:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    COMPOSE_BAKE: 'true'
    LAB2_CI_STAGE: '1'
  before_script:
    - apk add --no-cache bash python3 coreutils findutils
    - docker version
    - docker compose version

.lab2-test-artifacts:
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - lab2/reports/
    reports:
      junit:
        - lab2/reports/junit/*.xml

build-android:
  extends: [.lab2-docker, .lab2-test-artifacts]
  stage: build
  script:
    - bash lab2/scripts/run-lab2.sh build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - lab2/reports/
      - mobile-app/app/build/outputs/apk/debug/app-debug.apk
      - mobile-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
    reports:
      junit:
        - lab2/reports/junit/*.xml

unit-python:
  extends: [.lab2-docker, .lab2-test-artifacts]
  stage: unit
  needs: [build-android]
  script:
    - bash lab2/scripts/run-lab2.sh unit-python

unit-android:
  extends: [.lab2-docker, .lab2-test-artifacts]
  stage: unit
  needs: [build-android]
  script:
    - bash lab2/scripts/run-lab2.sh unit-android

integration:
  extends: [.lab2-docker, .lab2-test-artifacts]
  stage: integration
  needs: [unit-python, unit-android]
  script:
    - bash lab2/scripts/run-lab2.sh integration

# Requires a self-hosted runner with a booted emulator and a reachable ADB
# server. Run manually; never implicitly install the test app on a real phone.
e2e-android:
  extends: [.lab2-docker, .lab2-test-artifacts]
  stage: e2e
  tags: [android-emulator]
  when: manual
  allow_failure: true
  needs:
    - job: build-android
      artifacts: true
    - job: integration
      artifacts: false
  variables:
    LAB2_E2E_PREBUILT_APKS: '1'
  before_script:
    - apk add --no-cache bash python3 coreutils findutils android-tools
    - docker version
    - docker compose version
    - adb devices
  script:
    - bash lab2/scripts/run-lab2.sh e2e
