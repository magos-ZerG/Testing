# Use a Docker runner with privileged dind. Checkout is mounted inside two test containers.
# Test order, skip propagation, isolated storage reset, report-on-failure:
# lab2/scripts/run-lab2.sh
stages:
  - test

lab2:
  stage: test
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    COMPOSE_BAKE: 'true'
    RUN_ANDROID_DEVICE_TESTS: '0'  # Set to 1 on a runner with accessible ADB server and device
  before_script:
    - apk add --no-cache bash python3 coreutils findutils
    - docker version
    - docker compose version
  script:
    - bash lab2/scripts/run-lab2.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - lab2/reports/
      - mobile-app/data/build/reports/jacoco/lab/
    reports:
      junit:
        - lab2/reports/junit/*.xml
  cache:
    key: "$CI_PROJECT_PATH_SLUG-lab2-allure-history"
    paths:
      - lab2/reports/history/
    policy: pull-push
